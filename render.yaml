services:
  - type: web
    name: marketmemo-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketmemo-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        value: https://nush20.github.io
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: SUMMARY_PROVIDER
        value: gemini
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: marketmemo-db
    region: singapore
    plan: free
    databaseName: marketmemo
    user: marketmemo

